<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrivacyLens AI</title>
  <style>
    body { font-family: 'Inter', sans-serif; width: 380px; padding: 15px; margin: 0; background: #0f172a; color: #f8fafc; }
    h2 { font-size: 18px; margin: 0 0 15px 0; border-bottom: 1px solid #334155; padding-bottom: 10px; text-align: center; font-weight: 600; }
    .score-card { background: #1e293b; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; border: 1px solid #334155; }
    .score-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .score-value { font-size: 32px; font-weight: bold; color: #10b981; margin: 5px 0; }
    .score-max { font-size: 14px; color: #64748b; }
    
    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .status-box { background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid #334155; }
    .status-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .status-val { font-size: 14px; font-weight: bold; color: #e2e8f0; }
    
    .network-box { background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid #334155; margin-bottom: 15px; }
    
    .btn { width: 100%; padding: 10px; margin-top: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .btn:hover { background: #1d4ed8; }
    .btn-outline { background: transparent; border: 1px solid #475569; margin-top: 8px; color: #f8fafc; }
    .btn-outline:hover { background: #1e293b; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    
    .element-list { max-height: 120px; overflow-y: auto; background: #0f172a; padding: 8px; border-radius: 4px; margin-top: 10px; font-family: monospace; font-size: 11px; border: 1px inset #334155; }
    .element-item { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid #1e293b; }
    .tag-badge { background: #ef4444; color: white; padding: 2px 4px; border-radius: 3px; font-size: 9px; margin-right: 5px; }
    .tag-safe { background: #10b981; }
    
    .debug-section { margin-top: 15px; display: none; }
    #json-view { width: 100%; height: 120px; background: #000; color: #10b981; font-family: monospace; font-size: 10px; border: 1px solid #334155; padding: 8px; box-sizing: border-box; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>PrivacyLens AI</h2>
  
  <div class="score-card">
      <div class="score-title">Privacy Score</div>
      <div class="score-value" id="res-score">--</div>
      <div class="score-max">/ 100</div>
  </div>
  
  <div class="status-grid">
      <div class="status-box">
          <div class="status-label">Page</div>
          <div class="status-val" id="res-page">Unknown</div>
      </div>
      <div class="status-box">
          <div class="status-label">Sensitive Data</div>
          <div class="status-val" id="res-sensitive">0 detected</div>
      </div>
  </div>
  
  <div class="network-box">
      <div class="status-label" style="border-bottom: 1px solid #334155; padding-bottom: 5px; margin-bottom: 5px;">Network Activity</div>
      <div style="display: flex; justify-content: space-between; font-size: 12px;">
          <span><span id="res-net-total" style="font-weight: bold;">0</span> requests</span>
          <span style="color: #10b981;"><span id="res-net-1p">0</span> 1st-party</span>
          <span style="color: #ef4444;"><span id="res-net-3p">0</span> 3rd-party</span>
      </div>
  </div>
  
  <div id="pii-list" class="element-list" style="display: none;"></div>

  <button class="btn" id="btn-analyze">Analyze Current Page</button>
  <button class="btn btn-danger" id="btn-redact" style="display: none;">Redact Sensitive Values</button>
  <button class="btn btn-outline" id="btn-debug-toggle">View DOM JSON</button>
  
  <div class="debug-section" id="debug-section">
      <textarea id="json-view" readonly></textarea>
  </div>

  <script src="popup.js"></script>
</body>
</html>
